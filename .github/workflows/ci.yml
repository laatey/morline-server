name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: OpenAPI parses
        run: node -e "import('yaml').then(async (y) => { const fs = await import('node:fs'); y.parse(fs.readFileSync('openapi/openapi.yaml', 'utf8')); })"
